<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#85624b">
    <title>Trove — Sem ligação</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #292722; background: #f7f3ed; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(620px, 100%); background: #fffefa; border: 1px solid #e5ded4; border-radius: 22px; padding: clamp(24px, 6vw, 48px); box-sizing: border-box; box-shadow: 0 24px 80px #563b2520; }
      .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: #85624b; color: white; font-size: 22px; }
      h1 { margin: 24px 0 10px; font: 500 clamp(30px, 7vw, 48px)/1.05 Georgia, serif; }
      p { color: #6d685f; line-height: 1.6; }
      .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 24px 0; }
      .summary article { padding: 18px; border-radius: 14px; background: #f5efe8; }
      .summary strong { display: block; font-size: 28px; color: #85624b; }
      button { border: 0; border-radius: 10px; background: #85624b; color: white; font-weight: 700; padding: 13px 18px; cursor: pointer; }
      small { display: block; color: #8b857b; margin-top: 16px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">T</span>
      <h1>Está sem ligação.</h1>
      <p>A Trove mantém uma cópia recente apenas para consulta. As alterações voltam a ficar disponíveis quando o dispositivo recuperar a ligação.</p>
      <section class="summary" id="summary" hidden>
        <article><strong id="items">0</strong><span>artigos registados</span></article>
        <article><strong id="reservations">0</strong><span>reservas futuras</span></article>
      </section>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <small id="updated">Nenhuma cópia local disponível neste dispositivo.</small>
    </main>
    <script>
      const request = indexedDB.open("trove-offline", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("snapshots", { keyPath: "key" });
      request.onsuccess = () => {
        const query = request.result.transaction("snapshots").objectStore("snapshots").get("latest");
        query.onsuccess = () => {
          const snapshot = query.result;
          if (!snapshot) return;
          document.getElementById("summary").hidden = false;
          document.getElementById("items").textContent = snapshot.itemCount || 0;
          document.getElementById("reservations").textContent = snapshot.upcomingReservations || 0;
          document.getElementById("updated").textContent = `${snapshot.businessName || "Trove"} · cópia actualizada em ${new Date(snapshot.savedAt).toLocaleString("pt-MZ")}`;
        };
      };
    </script>
  </body>
</html>
